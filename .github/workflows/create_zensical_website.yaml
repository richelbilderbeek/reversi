# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
#
# Creates the website, including an online version of the game,
# built with Qt for WebAssembly and Emscripten.
name: Create Zensical website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_zensical_website.yaml
      - .github/smoke_test.py
      - 'docs/**'
      - zensical.toml
      # The game
      - '*.cpp'
      - '*.h'
      - '*.pri'
      - '*.pro'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  QT_VERSION: 6.11.3
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7
  BOOST_VERSION: 1.86.0

jobs:
  create_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - name: Install Boost headers
        # Only the headers are needed.
        # These are downloaded, instead of installed with apt,
        # so that Emscripten does not pick up the other system headers
        run: |
          curl --fail --location --retry 3 --output boost.tar.gz "https://github.com/boostorg/boost/releases/download/boost-${BOOST_VERSION}/boost-${BOOST_VERSION}-b2-nodocs.tar.gz"
          mkdir -p "$HOME/boost_include"
          tar xzf boost.tar.gz -C "$HOME/boost_include" --strip-components=1 "boost-${BOOST_VERSION}/boost"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build the game
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ../ReversiWebAssembly.pro BOOST_INCLUDE_DIR="$HOME/boost_include"
          make -j4
      - name: Add the game to the website
        run: |
          mkdir docs/game
          cp build/*.html build/*.js build/*.wasm docs/game/
          cp build/*.svg docs/game/ || true
      - name: Smoke test in a browser
        run: |
          pip install playwright
          (cd docs/game && python3 -m http.server 8000) &
          sleep 2
          python3 .github/smoke_test.py
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
